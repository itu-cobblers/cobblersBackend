name: Build and Deploy Backend

permissions:
  contents: write
  packages: write

on:
  push:
    branches: [main]

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch --tags
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          LATEST=${LATEST:-v0.0.0}

          MAJOR=$(echo $LATEST | awk -F. '{print substr($1,2)}')
          MINOR=$(echo $LATEST | awk -F. '{print $2}')
          PATCH=$(echo $LATEST | awk -F. '{print $3}')

          COMMIT_MSG=$(git log -1 --pretty=%B)

          if echo "$COMMIT_MSG" | grep -q '#major'; then
            NEW="v$((MAJOR+1)).0.0"
          elif echo "$COMMIT_MSG" | grep -q '#minor'; then
            NEW="v${MAJOR}.$((MINOR+1)).0"
          else
            NEW="v${MAJOR}.${MINOR}.$((PATCH+1))"
          fi

          git tag $NEW
          git push origin $NEW
          echo "new_tag=$NEW" >> $GITHUB_OUTPUT

      - name: Create release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ steps.tag.outputs.new_tag }}',
              name: '${{ steps.tag.outputs.new_tag }}',
              generate_release_notes: true
            })

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore cobblersBackend.Tests/cobblersBackend.Tests.csproj
      - name: Run tests
        run: dotnet test cobblersBackend.Tests/cobblersBackend.Tests.csproj --no-restore 

  build-and-push:
    needs: [tag, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/itu-cobblers/backend:${{ needs.tag.outputs.new_tag }}
            ghcr.io/itu-cobblers/backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: 178.105.149.59
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd ~/cobblersBackend
            git pull
            cd ~/cobblersDevOps
            docker compose build migrate
            docker compose up migrate
            docker compose pull backend
            docker compose up -d backend