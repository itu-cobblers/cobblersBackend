services:
  postgres:
    image: postgres:17
    container_name: bootit_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bootit
    ports:
      - "5432:5432"
    volumes:
      - bootit_postgres_data:/var/lib/postgresql/data

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: piston_api
    restart: always
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - ./data/piston/packages:/piston/packages
    tmpfs:
      - /tmp:exec

volumes:
  bootit_postgres_data:
